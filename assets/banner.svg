<svg xmlns="http://www.w3.org/2000/svg" width="800" height="200">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ff8a00;stop-opacity:1">
        <animate attributeName="stop-color" values="#ff8a00;#e52e71;#ff8a00" dur="4s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" style="stop-color:#e52e71;stop-opacity:1">
        <animate attributeName="stop-color" values="#e52e71;#ff8a00;#e52e71" dur="4s" repeatCount="indefinite" />
      </stop>
    </linearGradient>
  </defs>
  <rect width="800" height="200" fill="url(#grad1)" rx="15" ry="15"/>
  <text x="50%" y="50%" font-family="Arial, sans-serif" font-size="40" font-weight="bold" fill="white" text-anchor="middle" dominant-baseline="middle">Awesome Jobsite Safety Management</text>
  <text x="50%" y="70%" font-family="Arial, sans-serif" font-size="20" fill="white" text-anchor="middle" dominant-baseline="middle">Top Jobsite Safety Management Tools Ecosystem</text>
</svg>
